name: Publish

env:
  NPM_REGISTRY_URL: https://api.backup.wadeck.ch/npm

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Compute version
        id: version
        run: bash ci/scripts/compute-version.sh

      - name: Inject version into packages
        run: |
          npm version "${{ steps.version.outputs.version }}" --workspaces --no-git-tag-version

      - run: npm run build

      - run: npm test

      - name: Self-check violations
        run: node packages/violations-cli/dist/cli.js check

      - name: Configure auth for private registry
        run: |
          echo "//api.backup.wadeck.ch/npm/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          echo "=== .npmrc (token masked) ===" && sed 's/_authToken=.*/_authToken=***/' ~/.npmrc
          echo "=== npm whoami ===" && npm whoami --registry "${NPM_REGISTRY_URL}" 2>&1 || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WDRIVE_NPM_TOKEN }}

      - name: Publish violations-rules first (CLI has it as peer dep)
        working-directory: packages/violations-rules
        run: npm publish --tag ${{ steps.version.outputs.npm_tag }}

      - name: Publish violations-cli
        working-directory: packages/violations-cli
        run: npm publish --tag ${{ steps.version.outputs.npm_tag }}
