name: Publish

env:
  GITLAB_NPM_REGISTRY_PATH: //gitlab.com/api/v4/projects/84445653/packages/npm/

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Compute version
        id: version
        run: bash ci/scripts/compute-version.sh

      - name: Inject version into packages
        run: |
          npm pkg set version="${{ steps.version.outputs.version }}" --workspaces

      - run: npm run build

      - run: npm test

      - name: Self-check violations
        run: node packages/violations-cli/dist/cli.js check

      - name: Configure auth for GitLab npm registry
        run: |
          TOKEN=$(echo "${GITLAB_NPM_WRITE_TOKEN}" | tr -d '[:space:]')
          if [ -z "$TOKEN" ]; then
            echo "ERROR: GITLAB_NPM_WRITE_TOKEN is empty after trim"
            exit 1
          fi
          if [[ "$TOKEN" != gldt-* ]]; then
            echo "ERROR: GITLAB_NPM_WRITE_TOKEN does not start with 'gldt-'"
            exit 1
          fi
          echo "=== Token preview: ${TOKEN:0:9}*** ==="

          echo "@wadeck:registry=https:${GITLAB_NPM_REGISTRY_PATH}" >> .npmrc
          echo "${GITLAB_NPM_REGISTRY_PATH}:_authToken=${TOKEN}" >> .npmrc
          echo "auth-type=legacy" >> .npmrc
          echo "=== .npmrc (token masked) ===" && sed 's/_authToken=.*/_authToken=***/' .npmrc
          echo "=== whoami ===" && curl -s "https:${GITLAB_NPM_REGISTRY_PATH}-/whoami" -H "Authorization: Bearer ${TOKEN}"
          echo ""
        env:
          GITLAB_NPM_WRITE_TOKEN: ${{ secrets.GITLAB_NPM_WRITE_TOKEN }}

      - name: Publish violations-rules first (CLI has it as peer dep)
        working-directory: packages/violations-rules
        run: npm publish --tag ${{ steps.version.outputs.npm_tag }}

      - name: Publish violations-cli
        working-directory: packages/violations-cli
        run: npm publish --tag ${{ steps.version.outputs.npm_tag }}
