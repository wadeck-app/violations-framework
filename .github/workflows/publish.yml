name: Publish

env:
  GITHUB_NPM_REGISTRY_PATH: //npm.pkg.github.com/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Compute version
        id: version
        run: bash ci/scripts/compute-version.sh

      - name: Inject version into packages
        run: |
          npm pkg set version="${{ steps.version.outputs.version }}" --workspaces

      - run: npm run build

      - run: npm test

      - name: Self-check violations
        run: node packages/violations-cli/dist/cli.js check

      - name: Configure auth for GitHub Packages
        run: |
          echo "@wadeck-app:registry=https:${GITHUB_NPM_REGISTRY_PATH}" >> .npmrc
          echo "${GITHUB_NPM_REGISTRY_PATH}:_authToken=${GITHUB_TOKEN}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish violations-rules first (CLI has it as peer dep)
        working-directory: packages/violations-rules
        run: npm publish --tag ${{ steps.version.outputs.npm_tag }}

      - name: Publish violations-cli
        working-directory: packages/violations-cli
        run: npm publish --tag ${{ steps.version.outputs.npm_tag }}
